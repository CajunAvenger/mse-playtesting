		card.element.id = "cardbox-" + card.key;
		card.element.className = "card-container " + card.shape.replace("plane card", "battle");
		
		
		let img = document.createElement("img");
		img.className = "card-image " + card.shape;
		img.src = imgSrc + card.setID + "/" + card.imgName + imgExt;
		card.element.appendChild(img);
		if(card.imgName2) {
			let img2 = document.createElement("img");
			img2.className = "card-image card-image-2";
			img2.src = imgSrc + card.setID + "/" + card.imgName2 + imgExt;
			card.element.appendChild(img2);
		}
		
		if(!card.ptLine) {
			if(card.defense) {
				card.ptLine = "<" + card.defense + ">";
			}else if(card.loyalty !== "") {
				card.ptLine = "[" + card.loyalty + "]";
			}else if(card.power !== "" && card.toughness !== "") {
				card.ptLine = card.power + "/" + card.toughness;
			}else{
				card.ptLine = card.power + card.toughness;
			}
		}
		if(card.cardName2 && !card.ptLine2) {
			if(card.defense2) {
				card.ptLine2 = "<" + card.defense2 + ">";
			}else if(card.loyalty2 !== "") {
				card.ptLine2 = "[" + card.loyalty2 + "]";
			}else if(card.power2 !== "" && card.toughness2 !== "") {
				card.ptLine2 = card.power2 + "/" + card.toughness2;
			}else{
				card.ptLine2 = card.power2 + card.toughness2;
			}
		}
		
		let data = document.createElement("div");
		data.className = "card-data";
		card.element.appendChild(data);
		
		let namebox = document.createElement("div");
		namebox.className = "namebox";
		namebox.appendChild(fieldContainer(card, "cardName"));
		namebox.appendChild(fieldContainer(card, "manaCost"));
		let typebox = document.createElement("div");
		typebox.className = "typebox";
		typebox.appendChild(fieldContainer(card, "typeLine"));
		typebox.appendChild(fieldContainer(card, "rarity"));
		let textbox = document.createElement("textbox");
		textbox.className = "textbox";
		textbox.appendChild(fieldContainer(card, "rulesText"));
		textbox.appendChild(fieldContainer(card, "flavorText"));
		let ptbox = document.createElement("ptbox");
		ptbox.className = "ptbox";
		ptbox.appendChild(fieldContainer(card, "ptLine"));

		data.appendChild(namebox);
		data.appendChild(typebox);
		data.appendChild(textbox);
		data.appendChild(ptbox);
		
		if(card.cardName2) {
			data.appendChild(document.createElement("hr"));
			let namebox2 = document.createElement("div");
			namebox2.className = "namebox2";
			namebox2.appendChild(fieldContainer(card, "cardName2", "cardName"));
			namebox2.appendChild(fieldContainer(card, "manaCost2", "manaCost"));
			let typebox2 = document.createElement("div");
			typebox2.className = "typebox2";
			typebox2.appendChild(fieldContainer(card, "typeLine2", "typeLine"));
			typebox2.appendChild(fieldContainer(card, "rarity2", "rarity"));
			let textbox2 = document.createElement("textbox2");
			textbox2.className = "textbox2";
			textbox2.appendChild(fieldContainer(card, "rulesText2", "rulesText"));
			textbox2.appendChild(fieldContainer(card, "flavorText2", "flavorText"));
			let ptbox2 = document.createElement("ptbox2");
			ptbox2.className = "ptbox2";
			ptbox2.appendChild(fieldContainer(card, "ptLine2", "ptLine"));

			data.appendChild(namebox2);
			data.appendChild(typebox2);
			data.appendChild(textbox2);
			data.appendChild(ptbox2);
		}

		if(card.comment) {
			data.appendChild(document.createElement("hr"));
			let cm = document.createElement("div");
			cm.innerHTML = "Designer comments:";
			data.appendChild(cm);
			data.appendChild(fieldContainer(card, "comment"));
		}
		
		return card.element;
	}
	function fieldContainer(card, fieldName, extraClasses) {
		let cls = fieldName;
		if(extraClasses)
			cls += " " + extraClasses;
		let field_div = document.createElement("div");
		field_div.className = cls;
		field_div.innerHTML = formatTextHTML(card[fieldName]);
		return field_div;
	}
	function formatTextHTML(str) {
		if(!str)
			return "";
		str = str.replace(/\n/g, "<br>");
		str = str.replace(/[*]([^*]+)[*]/g, "<i>$1</i>");
		str = str.replace(/[{]([^}]+)[}]/g, function(matched, _1) {
			let letters = _1.toLowerCase().replace("/", "")
			return '<span class="mana mana-cost mana-' + letters + '"></span>';
		})
		return str;
	}
	function resort(ele) {
		let active = ele.classList.contains("active");
		let exc = ele.classList.contains("sort-button");
		let needsResorted = false; // does this need resorted or just hidden status changed?
		let needsReversed = ele.id == "reverse-button";
		let randomized = ele.id == "random-button";
		if(exc && active && !randomized)
			return; // double click that doesn't mean anything
		if(exc && !active) {
			// deselect the others
			let others = document.getElementsByClassName("sort-button");
			for(let i=0; i<others.length; i++) {
				if(others[i].id != ele.id) {
					others[i].classList.remove("active");
				}else{
					others[i].classList.add("active");
				}
			}
			needsResorted = true;
		}
		if(!exc && !randomized) // deselect this one
			ele.classList.toggle("active");
		updateSetCards(needsResorted, needsReversed);
	}
	function updateSetCards(needsResorted, needsReversed) {
		let exclude_color_regex;
		let exclude_type_regex;
		
		let exclude_colors = ["White", "Blue", "Black", "Red", "Green"];
		if(document.getElementById("green-button").classList.contains("active"))
			exclude_colors.splice(4, 1);
		if(document.getElementById("red-button").classList.contains("active"))
			exclude_colors.splice(3, 1);
		if(document.getElementById("black-button").classList.contains("active"))
			exclude_colors.splice(2, 1);
		if(document.getElementById("blue-button").classList.contains("active"))
			exclude_colors.splice(1, 1);
		if(document.getElementById("white-button").classList.contains("active"))
			exclude_colors.splice(0, 1);
		let exclude_multi = !document.getElementById("multicolor-button").classList.contains("active");
		let exclude_colorless = !document.getElementById("colorless-button").classList.contains("active");
		if(exclude_colors.length)
			exclude_color_regex = new RegExp(exclude_colors.join("|"), 'i');

		let exclude_types = ["Artifact", "Battle", "Creature", "Enchantment", "Instant", "Kindred", "Land", "Planeswalker", "Sorcery"];
		let type_buttons = document.getElementsByClassName("type-button");
		for(let t=0; t<type_buttons.length;t++) {
			if(!type_buttons[t].classList.contains("active"))
				continue;
			let typ = type_buttons[t].id.replace("-button", "");
			exclude_types.splice(exclude_types.indexOf(typ), 1);
		}
		if(exclude_types.length)
			exclude_type_regex = new RegExp(exclude_types.join("|"), 'i');
		let all_types = /Artifact|Battle|Creature|Enchantment|Instant|Kindred|Land|Planeswalker|Sorcery/;
		let exclude_other_types = !document.getElementById("other-button").classList.contains("active");
		
		let exclude_rarities = ["basic land", "common", "uncommon", "rare", "mythic rare", "mythic", "special", "bonus", "masterpiece", "token"];
		if(document.getElementById("common-button").classList.contains("active")) {
			exclude_rarities.splice(exclude_rarities.indexOf("common"), 1);
			exclude_rarities.splice(exclude_rarities.indexOf("basic land"), 1);
		}
		if(document.getElementById("uncommon-button").classList.contains("active"))
			exclude_rarities.splice(exclude_rarities.indexOf("uncommon"), 1);
		if(document.getElementById("rare-button").classList.contains("active"))
			exclude_rarities.splice(exclude_rarities.indexOf("rare"), 1);
		if(document.getElementById("mythic-button").classList.contains("active")) {
			exclude_rarities.splice(exclude_rarities.indexOf("mythic"), 1);
			exclude_rarities.splice(exclude_rarities.indexOf("mythic rare"), 1);
		}
		if(document.getElementById("special-button").classList.contains("active")) {
			exclude_rarities.splice(exclude_rarities.indexOf("bonus"), 1);
			exclude_rarities.splice(exclude_rarities.indexOf("special"), 1);
			exclude_rarities.splice(exclude_rarities.indexOf("masterpiece"), 1);
		}
		if(document.getElementById("token-button").classList.contains("active"))
			exclude_rarities.splice(exclude_rarities.indexOf("token"), 1);
		
		let sortBy = "number-button";
		let sort_buttons = document.getElementsByClassName("sort-button");
		for(let t=0; t<sort_buttons.length;t++) {
			if(sort_buttons[t].classList.contains("active"))
				sortBy = sort_buttons[t].id;
		}

		// check what's hidden/shown
		let keys = [];
		let searchScript = generateSearchScript();
		for(let c in database.cards) {
			let card = database.cards[c];
			if(exclude_color_regex) {
				if(card.color.match(exclude_color_regex))
					continue;
				if(card.color2 && card.color2.match(exclude_color_regex))
					continue;
			}
			if(exclude_colorless) {
				if(card.color == "")
					continue;
				if(card.hasOwnProperty("color2") && card.color2 == "")
					continue;
			}
			if(exclude_multi) {
				if(card.color.match("/"))
					continue;
				if(card.hasOwnProperty("color2") && card.color2.match("/"))
					continue;
				if(card.hasOwnProperty("color2") && card.color2 != card.color && card.color2 && card.color)
					continue;
			}
			if(exclude_type_regex) {
				if(card.typeLine.match(exclude_type_regex))
					continue;
				if(card.typeLine2 && card.typeLine2.match(exclude_type_regex))
					continue;
			}
			if(exclude_other_types) {
				if(!card.typeLine.match(all_types))
					continue;
				if(card.typeLine2 && !card.typeLine.match(all_types))
					continue;
			}
			if(exclude_rarities.includes(card.rarity))
				continue;
			if(!searchScript(card))
				continue;
			keys.push(c);
		}
		for(let c in database.cards) {
			if(keys.includes(c)) {
				database.cards[c].element.classList.remove("hidden");
			}else{
				database.cards[c].element.classList.add("hidden");
			}
		}
		// sort cards
		let set_block = document.getElementById("set-cards");
		if(document.getElementById("random-button").classList.contains("active")) {
			keys = shuffle(keys)
			for(let k in keys) {
				let card = database.cards[keys[k]];
				set_block.appendChild(card.element);
			}
		}
		else if(needsResorted) {
			let reverse = document.getElementById("reverse-button").classList.contains("active");
			keys.sort(function(a, b) {
				let result;
				let tokenA = (database.cards[a].setID == "tokens" ? 1 : 0);
				let tokenB = (database.cards[b].setID == "tokens" ? 1 : 0);
				result = tokenA - tokenB;
				if(result != 0)
					return result;
				let specialA = (database.cards[a].rarity == "special" ? 1 : 0);
				let specialB = (database.cards[b].rarity == "special" ? 1 : 0);
				result = specialA - specialB;
				if(result != 0)
					return result;
				if(sortBy == "mv-button") {
					result = database.cards[a].cmc - database.cards[b].cmc;
				}
				if(result != 0)
					return result;
				if(sortBy == "type-button") {
					let typeA = database.cards[a].typeLine;
					if(database.cards[a].typeLine2)
						typeA += "//" + database.cards[a].typeLine2;
					let typeB = database.cards[b].typeLine;
					if(database.cards[b].typeLine2)
						typeB += "//" + database.cards[b].typeLine2;
					if(typeA < typeB)
						return -1;
					if(typeA > typeB)
						return 1;
				}
				if(sortBy == "name-button") {
					if(database.cards[a].cardName < database.cards[b].cardName)
						return -1;
					if(database.cards[a].cardName > database.cards[b].cardName)
						return 1;
				}
				return database.cards[a].collNo - database.cards[b].collNo;
			})
			if(reverse)
				keys.reverse();
			for(let k in keys) {
				let card = database.cards[keys[k]];
				set_block.appendChild(card.element);
			}
		}
		else if(needsReversed) {
			let containers = document.getElementsByClassName("card-container");
			for(let i=2; i<=containers.length; i++) {
				let index = containers.length-i;
				set_block.appendChild(containers[index]);
			}
		}
	}
	function generateSearchScript() {
		let query = document.getElementById("search-bar").value;
		if(!query)
			return function(card) {
				return true;
			}
		let queries = [];	
		let quoteMatch = query.match(/(-)?([^ ]+) ?([:=<>]+) ?"([^"]+)"/g);
		for(let q in quoteMatch) {
			queries.push(quoteMatch[q]);
			query = query.replace(quoteMatch[q], "");
		}
		let singleMatch = query.match(/(-)?([^ ]+) ?([:=<>]+) ?([^ ]+)/g);
		for(let s in singleMatch) {
			queries.push(singleMatch[s]);
			query = query.replace(singleMatch[s], "");
		}
		let quoteNameMatch = query.match(/"[^"]+"/)
		for(let q in quoteNameMatch) {
			queries.push(quoteNameMatch[q].replace(/"/g, ""));
			query = query.replace(quoteNameMatch[q], "");
		}
		let remaining = query.match(/[^ ]+/g);
		for(let r in remaining) {
			queries.push(remaining[r]);
			query = query.replace(remaining[r], "");
		}
		console.log(queries);
		let functions = [];
		for(let q in queries) {
			let queryMatch = queries[q].match(/(-)?([^ ]+) ?([:=<>]+) ?"?([^"]+)/);
			console.log(queryMatch);
			if(queryMatch) {
				// o|ft|mana|type|t|pow|tou|loy|def
				let neg = !!queryMatch[1];
				let field = queryMatch[2].toLowerCase();
				let comp = queryMatch[3];
				let search = queryMatch[4].toLowerCase();
				let passed = true, failed = false;
				let legal = [
					"fo", "o", "ft", "cost", "type", "t",
					"pow", "power", "tou", "toughness",
					"loyalty", "loy", "defense", "def", "mv", "cmc"
				]
				if(!legal.includes(field))
					continue;
				if(neg)
					[passed, failed] = [failed, passed];
				
				if(field == "fo") {
					functions.push(function (card) {
						try{
							if(card.rulesText.toLowerCase().match(search))
								return passed;
							if(card.rulesText2 && card.rulesText2.toLowerCase().match(search))
								return passed;
							return failed;
						}catch(e){
							return true;
						}
					})
				}
				else if(field == "o") {
					functions.push(function (card) {
						try{
							if(card.rulesText.toLowerCase().replace(/[*][^*]+[*]/g, "").match(search))
								return passed;
							if(card.rulesText2 && card.rulesText2.toLowerCase().replace(/[*][^*]+[*]/g, "").match(search))
								return passed;
							return failed;
						}catch(e){
							return true;
						}
					})
				}
				else if(field == "ft") {
					functions.push(function (card) {
						try{
							if(card.flavorText.toLowerCase().match(search))
								return passed;
							if(card.flavorText2 && card.flavorText2.toLowerCase().match(search))
								return passed;
							return failed;
						}catch(e){
							return true;
						}
					})
				}
				else if(field == "type" || field == "t") {
					functions.push(function (card) {
						try{
							if(card.typeLine.toLowerCase().match(search))
								return passed;
							if(card.typeLine2 && card.typeLine2.toLowerCase().match(search))
								return passed;
							return failed;
						}catch(e){
							return true;
						}
					})
				}
				else{
					let field_names = {
						pow: "power",
						tou: "toughness",
						loy: "loyalty",
						def: "defense",
						mv: "cmc"
					}
					let field_name = field_names[field] || field;
					functions.push(function (card) {
						try{
							let main = card[field_name];
							let back = card[field_name + "2"];
							if(comp == "=" || comp == ":") {
								if(main == search || back == search)
									return passed;
								return failed;
							}
							if(comp == ">") {
								if(main > search || back > search)
									return passed;
								return failed;
							}
							else if(comp == "<") {
								if(main < search || back < search)
									return passed;
								return failed;
							}
							else if(comp == ">=" || comp == "=>") {
								if(main >= search || back >= search)
									return passed;
								return failed;
							}
							else if(comp == "<=" || comp == "=<") {
								if(main <= search || back <= search)
									return passed;
								return failed;
							}
							return failed;
						}catch(e){
							return true;
						}
					})
				}
			}else{
				// name match
				console.log("name has " + queries[q]);
				functions.push(function(card) {
					try{
						if(card.cardName.toLowerCase().match(queries[q].toLowerCase()))
							return true;
						if(card.cardName2 && card.cardName2.toLowerCase().match(queries[q].toLowerCase()))
							return true;
						return false;
					}catch(e){
						return true;
					}
				})
			}
		}
		return function(card) {
			for(let f in functions) {
				if(!functions[f](card))
					return false;
			}
			return true;
		}
	}
	
	function initialize() {
		let set_block = document.getElementById("set-cards");
		for(let c in database.cards) {
			set_block.appendChild(cardContainer(database.cards[c]));
		}
		updateSetCards(true);
	}
